server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: pf-private-chef
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # ⚠️ 改成你自己的库；生产环境请用环境变量注入，不要提交明文密码
    url: jdbc:mysql://127.0.0.1:3306/pf_private_chef?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis-plus:
  configuration:
    # 下划线转驼峰：pickup_code -> pickupCode
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ===== 微信小程序 =====
# 上线前必须填真实值；开发期可留空（登录接口会返回模拟 openid）
wx:
  appid: ${WX_APPID:}
  secret: ${WX_SECRET:}
  # 是否允许开发期伪造登录（生产必须 false）
  mock-login: ${WX_MOCK_LOGIN:true}

pf:
  # 业务配置
  booking:
    # 同一手机号每天最多预约几单（防刷）
    max-per-phone-per-day: 3

logging:
  level:
    com.pf.chef: debug
