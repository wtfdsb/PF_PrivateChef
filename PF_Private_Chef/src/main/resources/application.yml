server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: pf-private-chef
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # Local dev DB. In production inject via env vars, never commit plaintext passwords.
    url: jdbc:mysql://localhost:3306/pf_private_chef?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:123456}
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis-plus:
  configuration:
    # snake_case -> camelCase: pickup_code -> pickupCode
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ===== WeChat Mini Program =====
# Fill in real values before launch; leave empty in dev (login API returns mock openid).
wx:
  appid: ${WX_APPID:}
  secret: ${WX_SECRET:}
  # Allow fake login in dev. MUST be false in production.
  mock-login: ${WX_MOCK_LOGIN:true}

pf:
  # Business config
  booking:
    # Max bookings per phone per day (anti-spam)
    max-per-phone-per-day: 3
  # WeChat push to developer (multi-channel, whichever configured takes effect):
  #   1. PushPlus 200/day free after real-name: env PF_PUSHPLUS_TOKEN (https://www.pushplus.plus)
  #   2. ServerChan 5/day free: env PF_NOTIFY_KEY (https://sct.ftqq.com)
  # None set = push disabled.
  notify:
    key: ${PF_NOTIFY_KEY:}
    pushplus-token: ${PF_PUSHPLUS_TOKEN:}

logging:
  level:
    com.pf.chef: debug
